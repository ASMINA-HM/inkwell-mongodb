<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<header class="nav"><div class="wrap" id="nav"></div></header>
<main class="wrap"><div class="card form-box">
<h2>Welcome back</h2><p class="sub">Log in to manage your blogs.</p>
<form id="loginForm" novalidate>
<label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
<label for="password">Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password"><button type="button" data-eye="password">Show</button></div>
<div class="msg" id="msg"></div>
<button class="btn full" type="submit">Log in</button>
</form>
<p class="alt">New here? <a href="register.html">Create an account</a></p>
</div></main>
<footer>&copy; 2026 Inkwell. Built with HTML, CSS and JavaScript.</footer>
<script src="script.js"></script>
</body>
</html>
