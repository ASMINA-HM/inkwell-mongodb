<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
<header class="nav"><div class="wrap" id="nav"></div></header>
<main class="wrap"><div class="card form-box">
<h2>Create your account</h2><p class="sub">Start publishing in under a minute.</p>
<form id="regForm" novalidate>
<label for="name">Full name</label><input id="name" type="text" autocomplete="name">
<label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
<label for="password">Password</label><div class="pw"><input id="password" type="password" autocomplete="new-password"><button type="button" data-eye="password">Show</button></div>
<div class="meter"><i id="bar"></i></div><p class="hint" id="strength">Use 6 or more characters.</p>
<label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password">
<div class="msg" id="msg"></div>
<button class="btn full" type="submit">Create account</button>
</form>
<p class="alt">Already registered? <a href="login.html">Log in</a></p>
</div></main>
<footer>&copy; 2026 Inkwell. Built with HTML, CSS and JavaScript.</footer>
<script src="script.js"></script>
</body>
</html>
