<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
<header class="nav"><div class="wrap" id="nav"></div></header>
<main class="wrap dash">
<div class="dash-head"><div><h2 id="hello">Dashboard</h2><p class="sub" style="margin:0">Track and manage your blogs.</p></div>
<a class="btn" href="create-blog.html">Write a blog</a></div>
<div class="stats">
<div class="card stat"><b id="sPosts">0</b><span>Published</span></div>
<div class="card stat"><b id="sDrafts">0</b><span>Drafts</span></div>
<div class="card stat"><b id="sLikes">0</b><span>Likes received</span></div>
<div class="card stat"><b id="sCom">0</b><span>Comments</span></div>
<div class="card stat"><b id="sWords">0</b><span>Words written</span></div>
</div>
<div class="dash-head"><h3>Your blogs</h3><input id="find" type="search" placeholder="Search your blogs" style="max-width:260px" aria-label="Search your blogs"></div>
<div id="mine"></div>
</main>
<footer>&copy; 2026 Inkwell. Built with HTML, CSS and JavaScript.</footer>
<script src="script.js"></script>
</body>
</html>
