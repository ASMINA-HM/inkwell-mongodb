<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<header class="nav"><div class="wrap" id="nav"></div></header>
<section class="hero"><div class="wrap">
<h1>Stories worth writing down.</h1>
<p>Read what others have learned, and publish your own ideas in minutes.</p>
<div class="search"><input id="q" type="search" placeholder="Search posts by title or content" aria-label="Search posts"></div>
</div></section>
<main class="wrap">
<div class="toolbar"><div class="chips" id="chips"></div>
<select id="sort" aria-label="Sort posts"><option value="new">Newest first</option><option value="liked">Most liked</option></select></div>
<p class="meta" id="count" style="margin-bottom:14px"></p>
<div class="grid" id="posts"></div>
</main>
<footer>&copy; 2026 Inkwell. Built with HTML, CSS and JavaScript.</footer>
<script src="script.js"></script>
</body>
</html>
